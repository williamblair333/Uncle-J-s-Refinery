name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── 1. Bash syntax + static analysis ───────────────────────────────────────
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (syntax check)
        run: find . -name '*.sh' ! -path './.venv/*' -exec bash -n {} \;

      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          find . -name '*.sh' ! -path './.venv/*' ! -path './_review/*' \
            | xargs shellcheck --severity=error --exclude=SC1091

  # ── 2. Python package installation on a fresh Debian/Ubuntu image ──────────
  install-smoke:
    name: Package install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: uv sync (create venv + install all packages)
        run: uv sync --inexact

      - name: Smoke-test MCP binary versions
        run: |
          .venv/bin/jcodemunch-mcp  --version
          .venv/bin/jdatamunch-mcp  --help   > /dev/null
          .venv/bin/jdocmunch-mcp   --help   > /dev/null

  # ── 3. Auxiliary installer syntax (reliability, guardrails, langfuse) ──────
  aux-syntax:
    name: Auxiliary installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n on auxiliary installers
        run: |
          for f in install-reliability.sh install-guardrails.sh install-langfuse.sh; do
            [ -f "$f" ] && bash -n "$f" && echo "OK  $f" || echo "FAIL  $f"
          done

  # ── 4. Skill regression tests (static, no API calls) ─────────────────────
  test-skills:
    name: Skill frontmatter regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dev dependencies
        run: uv sync --inexact --only-group dev

      - name: pytest tests/test_skills.py
        run: uv run pytest tests/test_skills.py -v

  # ── 5. session-end-check.sh behavioural tests ────────────────────────────
  test-session-end-check:
    name: session-end-check tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dev dependencies
        run: uv sync --inexact --only-group dev

      - name: pytest tests/test_session_end_check.py
        run: uv run pytest tests/test_session_end_check.py -v

  # ── 6. Pay-for-itself audit unit tests ───────────────────────────────────
  test-audit:
    name: Audit pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: pytest tests/test_audit.py
        run: python -m pytest tests/test_audit.py -v

  # ── 7. install --update unit tests ───────────────────────────────────────
  test-install-update:
    name: install --update section detection tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dev dependencies
        run: uv sync --inexact --only-group dev

      - name: pytest tests/test_install_update.py (unit tests only)
        run: uv run pytest tests/test_install_update.py -v -k "not guard"

  # ── 8. origin/main regression detector ───────────────────────────────────
  # Guards the guard: this detector is what catches a force-reset of origin/main
  # (five occurred between 2026-08-04 and 2026-08-14 before anyone counted them).
  # Needs only pytest + git — the cases build a real bare repo as `origin`.
  test-origin-main-regression:
    name: origin/main regression detector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: pytest tests/test_origin_main_regression.py
        run: python -m pytest tests/test_origin_main_regression.py -v

  # ── 9. push-guard behaviour matrix ───────────────────────────────────────
  # A security control: the BLOCK cases matter more than the ALLOW ones, since
  # a fix for false positives that creates a false negative is worse than the
  # bug. Needs pytest + jq (the guard parses its PreToolUse payload with jq).
  test-push-guard:
    name: push-guard behaviour matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: pytest tests/test_push_guard.py
        run: python -m pytest tests/test_push_guard.py -v

  # ── 10. vault-session-check tests ────────────────────────────────────────
  # A Stop hook. The exit-code invariant is the one that must never regress:
  # a non-zero exit can trap session teardown. The content-leak cases matter
  # equally — the vault it inspects holds a personal-context note and an
  # archive with a plaintext credential, so warnings carry counts, never text.
  # Needs pytest + git + jq (the hook parses its Stop payload with jq); the
  # cases build a real vault repo and a real JSONL transcript.
  test-vault-session-check:
    name: vault-session-check tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: pytest tests/test_vault_session_check.py
        run: python -m pytest tests/test_vault_session_check.py -v

  # ── 11. surface-write-guard behaviour matrix ─────────────────────────────
  # A security control, same posture as push-guard: the BLOCK cases matter more
  # than the ALLOW ones, since a fix for a logging bug that narrows detection is
  # strictly worse than the bug. The KNOWN_GAPS cases are strict xfails — closing
  # a gap turns one into an unexpected pass and fails this job on purpose, so the
  # list cannot rot silently. Needs pytest + jq (the guard parses its payload).
  test-surface-write-guard:
    name: surface-write-guard behaviour matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: pytest tests/test_surface_write_guard.py
        run: python -m pytest tests/test_surface_write_guard.py -v
