# Small local model for the hosts without a GPU: the Pi 4 (ha-pi-01, arm64) and tc-vmh-03.
# CPU-only llama-server, same build as llama-heretic. Start it with `just small up -d`.
#
# Model per host (SMALL_MODEL in the environment or .env next to this file):
#   Pi 4:      qwen3.5-2b-heretic  (Qwen3.5-2B-Heretic-Q4_K_M.gguf, 1.3 GB)
#   tc-vmh-03: qwen3.5-4b-heretic  (Qwen3.5-4B-Heretic-Q4_K_M.gguf, 2.8 GB)
# Both: darrellbest/Qwen3.5-{2B,4B}-Heretic-GGUF on Hugging Face, Apache-2.0, sha256 checked
# 2026-10-23. Copy /opt/models/gguf/qwen3.5-*-heretic/ from the main host.
# Loopback only (Bill, 2026-10-23: local only for now).
services:
  llama-small:
    image: ghcr.io/ggml-org/llama.cpp:server-b11459   # multi-arch: amd64, arm64
    container_name: llama-small
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SMALL_PORT:-8096}:8080"
    volumes:
      - /opt/models/gguf/${SMALL_MODEL:-qwen3.5-2b-heretic}:/models:ro
    command:
      - -m
      - /models/${SMALL_GGUF:-Qwen3.5-2B-Heretic-Q4_K_M.gguf}
      - --alias
      - small
      - -c
      - "8192"
      - -np
      - "1"
      - --jinja
      - --sleep-idle-seconds
      - "600"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
